# The rn.green catalog: which packages are covered, which versions are checked, and how each
# package is tested and built. The site lists what is here, and the Codemagic workflow runs from it:
#
#   - compatibility-check tests one pair of library version and React Native version, following the
#     package's source, setup, test and demo settings below, and sends the result as a pull request.
#     A person starts it by hand. With `record` on, both versions must be on lines listed here.
#
# Results are not kept here. They are in compatibility-data/<package name>/compatibility.json.
#
# Patch releases are folded into minor lines, so `versions` holds one version per line: its newest
# patch. New releases are added by hand for now. The README describes every field.

schema = 1

[react-native]
# Every package is checked against each of these. A version with a prerelease tag is shown as a
# release candidate.
versions = [
  "0.88.0-rc.3",
  "0.87.1",
  "0.86.3",
  "0.85.3",
  "0.84.1",
  "0.83.10",
  "0.82.1",
  "0.81.6",
  "0.80.3",
  "0.79.7",
  "0.78.3",
]

# ---------------------------------------------------------------------------------------------
# Packages, in name order. Every package with settings is checked.
#
# `enabled = false` on a package keeps it on the site and refuses checks with `record` on, for
# example while its settings are being fixed. No package uses it now.
# ---------------------------------------------------------------------------------------------

[[package]]
name = "@codemagic/react-native-patch"
repository = "https://github.com/codemagic-ci-cd/codemagic-patch"
description = "React Native client SDK for Codemagic Patch — over-the-air JavaScript & asset updates for React Native and Expo apps."
license = "Apache-2.0"
versions = ["0.5.0", "0.4.0", "0.3.0"]

[package.source]
tag = "@codemagic/react-native-patch@{version}"
dir = "client"

[package.setup]
# The demo app is not a workspace of the repository, so it installs separately.
install = [".", "examples/on-device-demo"]
prepare = [{ dir = "client", run = ["yarn", "build"] }]

[package.test]
# The tests (client/test/) are not in the public repository.
run = "none"

[package.demo]
# At every tag this app names version 0.1.0 from npm. The check points it at the checked-out
# client/ instead, so that the tagged code is what gets built.
dir = "examples/on-device-demo"

[[package]]
name = "@react-navigation/bottom-tabs"
repository = "https://github.com/react-navigation/react-navigation"
description = "Bottom tab navigator following iOS design guidelines"
license = "MIT"
versions = ["7.19.2", "7.18.18", "7.17.2"]

[package.source]
tag = "@react-navigation/bottom-tabs@{version}"
dir = "packages/bottom-tabs"

[package.setup]
# The repository asks for Node 24.13 or newer at its newer tags and Node 22 at its older ones.
node = "24"
install = ["."]

[package.test]
dir = "."
run = ["yarn", "jest", "packages/bottom-tabs"]

[package.demo]
# An Expo app shared by every react-navigation package; it has no native folders until prebuild.
dir = "example"

